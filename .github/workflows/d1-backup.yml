name: D1 backup

# Exports the accumulated trend history to the media bucket so an account or
# migration mistake is recoverable. Configure the repository secrets:
#   CLOUDFLARE_API_TOKEN  (D1 edit + R2 edit permissions)
#   CLOUDFLARE_ACCOUNT_ID
# and the repository variable:
#   BACKUP_BUCKET (e.g. ventriloquist-backups)
# Apply an R2 lifecycle rule (or delete old objects) to cap retention.

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          stamp="$(date -u +%Y-%m-%d)"
          pnpm --filter @ventriloquist/worker exec wrangler d1 export DB \
            --remote --output "backup-${stamp}.sql"
          pnpm --filter @ventriloquist/worker exec wrangler r2 object put \
            "${{ vars.BACKUP_BUCKET }}/d1/ventriloquist-${stamp}.sql" \
            --file "backup-${stamp}.sql"
